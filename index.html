<!DOCTYPE html>
<!-- HTML = la ESTRUCTURA de la página. Aquí solo ponemos el "esqueleto";
     el contenido de cada ejercicio lo genera app.js dentro de <main id="app">. -->
<html lang="es">
<head>
  <!-- UTF-8 es imprescindible para que los caracteres japoneses se vean bien -->
  <meta charset="UTF-8">
  <!-- Hace que la página se adapte al ancho del móvil -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>日本語ノート · Repaso de japonés</title>
  <!-- Enlazamos el archivo de estilos -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="sin-sesion">
  <header>
    <h1>日本語ノート</h1>
    <!-- Menú: cada botón tiene data-sec, que app.js usa para saber qué sección mostrar -->
    <nav>
      <button data-sec="test" class="activo">Test</button>
      <button data-sec="tarjetas">Tarjetas</button>
      <button data-sec="unir">Unir</button>
      <button data-sec="huecos">Huecos</button>
      <button data-sec="ordenar">Ordenar</button>
      <button data-sec="ordenarAleatorio">Ordenar aleatorio</button>
      <button data-sec="dictado">Dictado</button>
      <button data-sec="canciones">Canciones</button>
      <button data-sec="configuracion">Configuración</button>
    </nav>
    <!-- Usuario con la sesión iniciada; app.js lo muestra al entrar -->
    <div class="usuario" id="usuario" hidden>
      <span id="nombre-usuario"></span>
      <button id="salir">Cambiar de usuario</button>
    </div>
  </header>

  <!-- Aquí app.js "dibuja" el ejercicio actual -->
  <main id="app"></main>
  <div id="aviso-global" role="status" hidden></div>
  <div id="estado-red" role="status" hidden></div>

  <!-- "defer" = ejecutar el script cuando la página ya está cargada -->
  <!-- Firebase (versión "compat", que funciona con scripts normales). Debe cargarse antes que app.js -->
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js" defer></script>
  <script src="firebase-config.js" defer></script>
  <script src="ejemplos.js" defer></script>
  <script src="canciones.js" defer></script>
  <script src="generador.js" defer></script>
  <script src="app.js" defer></script>
  <script>
    // Service worker (sw.js): guarda los archivos de la app para poder abrirla sin conexión
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
